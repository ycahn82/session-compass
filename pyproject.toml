[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-sessions"
version = "0.1.0"
description = "List and resume Claude Code, Codex, Antigravity, and Copilot CLI sessions from one place"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "12signal", email = "pavbyte@gmail.com" }
]
keywords = ["cli", "claude-code", "codex", "copilot", "antigravity", "sessions", "resume"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.scripts]
sessions = "cli_sessions.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_sessions"]
